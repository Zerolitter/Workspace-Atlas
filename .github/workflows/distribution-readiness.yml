name: Distribution readiness

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: distribution-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  RUST_BACKTRACE: "1"

jobs:
  no-publish-contract:
    name: No-publish contract / Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        rust: ["1.94", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Rust channel and components
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy
          rustup override set '${{ matrix.rust }}'
          rustc --version --verbose
          cargo --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build the shipped executable allowlist
        run: cargo build --locked --bins
      - name: Checker mutation tests
        run: python scripts/check-distribution-readiness.py --no-publish --self-test
      - name: Executable external-maintainer dry run
        shell: bash
        run: >-
          python scripts/check-distribution-readiness.py --no-publish
          --binary-dir target/debug

  accepted-module-evidence:
    name: Accepted module evidence / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Focused configuration capability lifecycle and capacity suites
        run: >-
          cargo test --locked
          --test config_privacy
          --test config_continuity
          --test mcp_conformance
          --test mcp_compiler_parity
          --test context_route_decision
          --test compiler_lifecycle
          --test compiler_composition
          --test compiler_surface_parity
          --test context_observation
          --test context_metrics
          --test context_yield_v15
          --test context_yield_experiments
          --test task_compiler_v13
          --test task_compiler_v20
          --test exact_source_compiler
          --test context_temporal_recipes
          --test delta_lease_v20
          --test temporal_intelligence_v14
          --test serving_readiness
          --test retention_unregister
          --test benchmark_manifest
          --test distribution_readiness
      - name: Full locked suite
        run: cargo test --locked
      - name: Public hygiene unit tests
        run: python -m unittest scripts/test_check_public_hygiene.py
      - name: Public and package hygiene
        run: python scripts/check-public-hygiene.py

  real-client-provider-evidence:
    name: Real client and provider evidence / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node 24.14.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Install exact provider toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rust-analyzer
          rustup override set 1.94.1
      - name: Build client and provider smoke binaries
        run: cargo build --locked --bin atlas --bin atlas-mcp
      - name: Validate portable smoke contracts
        run: |
          python scripts/provider-smoke.py --self-test
          python scripts/mcp-client-smoke.py --self-test
      - name: Exercise old catalogue restore migration and installed providers
        shell: bash
        run: >-
          python scripts/provider-smoke.py
          --atlas target/debug/atlas${{ runner.os == 'Windows' && '.exe' || '' }}
          --provider all
      - name: Exercise real Inspector and Codex clients
        shell: bash
        run: >-
          python scripts/mcp-client-smoke.py
          --client all
          --atlas target/debug/atlas${{ runner.os == 'Windows' && '.exe' || '' }}
          --atlas-mcp target/debug/atlas-mcp${{ runner.os == 'Windows' && '.exe' || '' }}

  package-evidence:
    name: Package evidence / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out the revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Exact package path list
        run: cargo package --list --locked
      - name: Package unpack and compile verification
        run: cargo package --locked
